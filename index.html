<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор Жизни</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #131926;
            --card-bg: #1e2640;
            --accent-color: #4ade80;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        .header {
            width: 100%;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .status-title {
            font-size: 14px;
            color: var(--text-muted);
        }
        .status-value {
            font-weight: bold;
            color: var(--accent-color);
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
        }
        .progress-bar-bg {
            background: #0f172a;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #22c55e, #4ade80);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .balance-section {
            text-align: center;
            margin: 20px 0;
        }
        .balance-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .balance-amount {
            font-size: 38px;
            font-weight: 800;
            margin: 5px 0;
        }
        .passive-income {
            font-size: 14px;
            color: var(--accent-color);
        }
        .clicker-container {
            position: relative;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .click-button {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #2e3b66 0%, #1e2640 100%);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            cursor: pointer;
            transition: transform 0.05s ease;
            border: 4px solid #2d3758;
        }
        .click-button:active {
            transform: scale(0.95);
        }
        .floating-text {
            position: absolute;
            color: #ffffff;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }
        .businesses-section {
            width: 100%;
            margin-top: 15px;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .business-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .business-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .biz-name {
            font-weight: bold;
            font-size: 16px;
        }
        .biz-stats {
            font-size: 12px;
            color: var(--text-muted);
        }
        .biz-count {
            color: var(--accent-color);
            font-weight: 600;
        }
        .buy-button {
            background: var(--accent-color);
            color: #000000;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .buy-button:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="status-container">
            <span class="status-title">Ваш статус в жизни:</span>
            <span id="player-status" class="status-value">Бомж</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="balance-section">
        <div class="balance-label">Капитал</div>
        <div id="balance" class="balance-amount">0 ₽</div>
        <div id="income-speed" class="passive-income">+0 ₽/сек пассивно</div>
    </div>

    <div class="clicker-container">
        <div class="click-button" id="click-btn">💼</div>
    </div>

    <div class="businesses-section">
        <div class="section-title">Купить источники дохода</div>
        <div class="business-list" id="business-container"></div>
    </div>

    <script>
        
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg && typeof tg.expand === 'function') {
            tg.expand();
        }

        let gameState = {
            balance: 0,
            clickPower: 1,
            passiveIncome: 0,
            statusIndex: 0
        };

        const statuses = [
            { name: "Бомж", req: 0 },
            { name: "Студент", req: 500 },
            { name: "Фрилансер", req: 5000 },
            { name: "Бизнесмен", req: 50000 },
            { name: "Олигарх", req: 500000 },
            { name: "Властелин Мира", req: Infinity }
        ];

        const businesses = [
            { id: 'job', name: 'Раздача листовок', cost: 50, income: 1, count: 0, icon: '📄' },
            { id: 'shawarma', name: 'Шаурмичная', cost: 300, income: 8, count: 0, icon: '🌯' },
            { id: 'carwash', name: 'Автомойка', cost: 1500, income: 45, count: 0, icon: '🚗' },
            { id: 'it_company', name: 'IT-Стартап', cost: 8000, income: 260, count: 0, icon: '💻' },
            { id: 'crypto', name: 'Майнинг ферма', cost: 45000, income: 1500, count: 0, icon: '⚡' },
            { id: 'oil', name: 'Нефтяная вышка', cost: 250000, income: 9000, count: 0, icon: '🛢️' }
        ];

        const balanceEl = document.getElementById('balance');
        const incomeEl = document.getElementById('income-speed');
        const clickBtn = document.getElementById('click-btn');
        const businessContainer = document.getElementById('business-container');
        const statusEl = document.getElementById('player-status');
        const progressBar = document.getElementById('progress-bar');

        function formatMoney(num) {
            return num.toLocaleString('ru-RU') + ' ₽';
        }

        function updateUI() {
            balanceEl.textContent = formatMoney(Math.floor(gameState.balance));
            incomeEl.textContent = `+${formatMoney(gameState.passiveIncome)}/сек пассивно`;
            checkStatus();
            updateBusinessButtons();
        }

        function checkStatus() {
            let currentStatus = statuses[gameState.statusIndex];
            let nextStatus = statuses[gameState.statusIndex + 1];

            if (gameState.balance >= nextStatus.req && gameState.statusIndex < statuses.length - 2) {
                gameState.statusIndex++;
                currentStatus = statuses[gameState.statusIndex];
                nextStatus = statuses[gameState.statusIndex + 1];
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }

            statusEl.textContent = currentStatus.name;

            if (nextStatus.req !== Infinity) {
                let progress = ((gameState.balance - currentStatus.req) / (nextStatus.req - currentStatus.req)) * 100;
                progressBar.style.width = `${Math.min(Math.max(progress, 0), 100)}%`;
            } else {
                progressBar.style.width = '100%';
            }
        }

        function initBusinesses() {
            businessContainer.innerHTML = '';
            businesses.forEach((biz, index) => {
                const card = document.createElement('div');
                card.className = 'business-card';
                card.innerHTML = `
                    <div>
                        <div class="biz-name">${biz.icon} ${biz.name} <span class="biz-count" id="count-${biz.id}"></span></div>
                        <div class="biz-stats">Доход: +${biz.income} ₽/с</div>
                    </div>
                    <button class="buy-button" id="btn-${biz.id}" onclick="buyBusiness(${index})">
                        ${formatMoney(biz.cost)}
                    </button>
                `;
                businessContainer.appendChild(card);
            });
        }

        function updateBusinessButtons() {
            businesses.forEach(biz => {
                const btn = document.getElementById(`btn-${biz.id}`);
        function updateBusinessButtons() {
            businesses.forEach(biz => {
                const btn = document.getElementById(`btn-${biz.id}`);
                const countEl = document.getElementById(`count-${biz.id}`);
                
                if (btn && countEl) {
                    btn.textContent = formatMoney(biz.cost);
                    countEl.textContent = biz.count > 0 ? `x${biz.count}` : '';
                    btn.disabled = gameState.balance < biz.cost;
                }
            });
        }

        window.buyBusiness = function(index) {
            const biz = businesses[index];
            if (gameState.balance >= biz.cost) {
                gameState.balance -= biz.cost;
                biz.count++;
                gameState.passiveIncome += biz.income;
                biz.cost = Math.floor(biz.cost * 1.15);
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
                updateUI();
            }
        };

        clickBtn.addEventListener('click', (e) => {
            gameState.balance += gameState.clickPower;
            
            const floating = document.createElement('div');
            floating.className = 'floating-text';
            floating.style.left = `${e.clientX - 10}px`;
            floating.style.top = `${e.clientY - 20}px`;
            floating.textContent = `+${gameState.clickPower}₽`;
            document.body.appendChild(floating);
            
            setTimeout(() => { floating.remove(); }, 600);
            
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            updateUI();
        });

        setInterval(() => {
            if (gameState.passiveIncome > 0) {
                gameState.balance += gameState.passiveIncome;
                updateUI();
            }
        }, 1000);

        initBusinesses();
        updateUI();
        if (tg && typeof tg.ready === 'function') {
            tg.ready();
        }
