 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор Жизни</title>
    <!-- Подключение Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #182533;
            --tg-theme-text-color: #ffffff;
            --tg-theme-button-color: #2f6ea5;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #7d8b99;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 16px;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
        }

        .username {
            font-weight: bold;
            color: var(--tg-theme-button-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.08);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
        }

        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--tg-theme-hint-color);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        .panel {
            display: none;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 15px;
            min-height: 200px;
        }

        .panel.active {
            display: block;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .action-btn {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .action-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .logs {
            margin-top: 15px;
            font-size: 12px;
            color: var(--tg-theme-hint-color);
            max-height: 60px;
            overflow-y: auto;
            text-align: center;
        }

     /* Кнопка меню */
.menu-burger-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
    color: var(--tg-theme-text-color);
    background: rgba(255,255,255,0.05);
    padding: 4px 10px;
    border-radius: 8px;
    line-height: 1;
}

/* Смещаем заголовок чуть ниже или правее, чтобы кнопка не перекрывала текст */
.header {
    padding-top: 45px; /* Корректировка под кнопку */
}

/* Боковое меню */
.side-menu {
    position: fixed;
    top: 0;
    left: -260px; /* Изначально спрятано */
    width: 240px;
    height: 100%;
    background: #111a24;
    box-shadow: 5px 0 15px rgba(0,0,0,0.5);
    z-index: 100;
    transition: left 0.3s ease;
    padding: 20px;
    box-sizing: border-box;
}
.side-menu.open {
    left: 0;
}
.menu-close-btn {
    text-align: right;
    font-size: 20px;
    cursor: pointer;
    color: var(--tg-theme-hint-color);
}
.menu-title {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
}
.menu-items {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.menu-item {
    padding: 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
}
.menu-item:hover {
    background: var(--tg-theme-button-color);
}

/* Модальные окна */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 110;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
}
.modal-content {
    background: #1c2a38;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
}
.modal-stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 14px;
}
.modal-stat-row:last-of-type {
    border-bottom: none;
}

/* >>> ВСЯ СЛЕДУЮЩАЯ ЧАСТЬ ВСТАВЛЯЕТСЯ СЮДА: <<< */
        /* Стили для уровня и прогресс-бара */
        .level-container {
            margin-top: 8px;
            font-size: 14px;
        }
     
        .status-badge {
            display: inline-block;
            background: var(--tg-theme-button-color);
            color: #fff;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 5px;
            vertical-align: middle;
        }
     
        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            height: 8px;
            width: 100%;
            margin-top: 6px;
            overflow: hidden;
        }
     
        .progress-bar-fill {
            background: #4caf50;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
     
/* Красивая сетка для предметов инвентаря */
.inventory-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* В два столбца */
    gap: 8px;
    margin-top: 10px;
}

/* Стиль карточки предмета */
.inventory-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: transform 0.2s;
}

    </style>
</head>
<body>
 
<!-- Иконка бургер-меню -->
<div class="menu-burger-btn" onclick="toggleMenu(true)">☰</div>

<!-- Само боковое меню (шторка) -->
<div id="side-menu" class="side-menu">
    <div class="menu-close-btn" onclick="toggleMenu(false)">✕</div>
    <div class="menu-title">Меню игры</div>
    
    <div class="menu-items">
        <div class="menu-item" onclick="openMenuTab('menu-stats')">📊 Статистика</div>
        <div class="menu-item" onclick="openMenuTab('menu-inventory')">🎒 Инвентарь</div>
        <div class="menu-item" onclick="openMenuTab('menu-bank')">🏦 Банк</div>
    </div>
</div>

<!-- Модальные окна для пунктов меню -->
<div id="menu-modal-overlay" class="modal-overlay" onclick="closeMenuModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <!-- Контент Статистики -->
        <div id="menu-stats" class="menu-panel">
            <h3>📊 Личная статистика</h3>
                                     <div class="modal-stat-row">
                    <span>Текущий уровень:</span> 
                    <strong id="m-stat-level">1</strong>
                </div>
                <div class="modal-stat-row">
                    <span>Всего заработано:</span> 
                    <strong id="m-stat-total-money">1 000 ₽</strong>
                </div>
                <button class="action-btn" style="width:100%; margin-top:15px;" onclick="closeMenuModal()">Закрыть</button>
            </div>

            <!-- Контент Инвентаря -->
            <div id="menu-inventory" class="menu-panel" style="display: none;">
                <h3>🎒 Ваш инвентарь</h3>
                <div class="inventory-grid">
                    <div class="inventory-card">🍏 Яблоко (2 шт)</div>
                    <div class="inventory-card">🥤 Энергетик (1 шт)</div>
                </div>
                <button class="action-btn" style="width:100%; margin-top:15px;" onclick="closeMenuModal()">Закрыть</button>
            </div>

            <!-- Контент Банка -->
            <div id="menu-bank" class="menu-panel" style="display: none;">
                <h3>🏦 Банковский счет</h3>
                <div class="modal-stat-row">
                    <span>Вклад в банке:</span> 
                    <strong id="m-bank-deposit">0 ₽</strong>
                </div>
                <button class="action-btn" style="width:100%; margin-top:15px;" onclick="closeMenuModal()">Закрыть</button>
            </div>

        </div>
    </div>

    <!-- Основной скрипт управления игрой -->
    <script>
        // Инициализация Telegram Web App API
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand(); // Разворачиваем приложение на весь экран
            if (tg.initDataUnsafe?.user?.first_name) {
                // Подставляем имя пользователя из Telegram
                document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
            }
        }

        // Функция открытия/закрытия боковой шторки меню
        function toggleMenu(open) {
            const sideMenu = document.getElementById('side-menu');
            if (open) {
                sideMenu.classList.add('open');
            } else {
                sideMenu.classList.remove('open');
            }
        }

        // Функция открытия окон (Статистика, Инвентарь, Банк) из бокового меню
        function openMenuTab(tabId) {
            toggleMenu(false); // Скрываем шторку меню
            
            // Скрываем абсолютно все панели в модальном окне
            document.querySelectorAll('.menu-panel').forEach(panel => {
                panel.style.display = 'none';
            });
            
            // Показываем только ту панель, на которую нажали
            document.getElementById(tabId).style.display = 'block';
            // Открываем темный фон-оверлей
            document.getElementById('menu-modal-overlay').style.display = 'flex';
        }

        // Функция закрытия модального окна
        function closeMenuModal() {
            document.getElementById('menu-modal-overlay').style.display = 'none';
        }

        // Функция переключения главных вкладок (Работа / Магазин)
        function switchMainTab(panelId) {
            // Скрываем обе панели
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
            // Снимаем подсветку с кнопок вкладок
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            // Активируем нужную панель и подсвечиваем нажатую кнопку
            document.getElementById(panelId).classList.add('active');
            event.target.classList.add('active');
        }

        // Вспомогательные функции для вывода логов на экран
        function logMessage(text) {
            document.getElementById('logs-output').innerText = text;
        }

        function doWork(reward, energyCost) {
            logMessage(`Вы отлично поработали! Заработано +${reward} ₽`);
        }

        function buyItem(price) {
            logMessage(`Вы купили предмет за ${price} ₽`);
        }
    </script>
</body>
</html>
